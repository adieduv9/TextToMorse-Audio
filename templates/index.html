<!DOCTYPE html>
<html>
<head>
    <title>Morse Transmitter</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="container">

    <h1>Morse Transmitter</h1>
    <p>International Morse Code · Encode & Decode</p>
    <p class="status">Station Online · Ready to Transmit</p>

    <h3>Input Signal</h3>

    <textarea id="inputText" placeholder="Enter text or Morse code here..."></textarea>

    <div class="buttons">
        <button onclick="convert('encode')">▶ Text → Morse</button>
        <button onclick="convert('decode')">◀ Morse → Text</button>
    </div>

    <h3>OUTPUT</h3>

    <div id="output">[ awaiting transmission... ]</div>

    <div class="action-buttons">
        <button onclick="copyOutput()">COPY</button>
        <button onclick="playAudio()">🔊 Play Morse</button>
    </div>

    <details>
        <summary>▼ Morse Code Reference Table</summary>
        <p>International Morse Code · ITU Standard · Est. 1865</p>
    </details>

</div>

<script src="/static/morse.js"></script>
</body>
</html>
